async function saveConfig(ev){
  ev.preventDefault(); if (!requireWrite()) return;
  const fd = new FormData(ev.target);
  const n = k => Number(fd.get(k)) || 0, s = k => String(fd.get(k) || "").trim();
  const c = {margen:n("margen"), indirectos:n("indirectos"), iva:n("iva"), flete:n("flete"), prefijo:s("prefijo") || "COT", inicioConsecutivo:n("inicioConsecutivo"), empresa:s("empresa"), direccion:s("direccion"), vigencia:s("vigencia"), tiempoEntrega:s("tiempoEntrega"), intro:s("intro"), terminos:String(fd.get("terminos") || "")};
  try { await Store.put("config", "general", c); toast("Configuración guardada."); } catch(err){ toast(err.message, "bad"); }
}

/* ================= Hojas (cotización / OS) ================= */
function hojaHTML(e, tipo, imgMap){
  const c = e.cotizacion; const prov = state.provs.find(p => p.id === e.proveedorId);
  const imgFor = l => { const s = l.imagen ? (imgMap?.[l.imagen] || srcOf(l.imagen)) : ""; return s ? `<img src="${esc(s)}" alt="">` : "N/A"; };
  const desc = l => `${esc(l.descripcion)}${l.notas ? `<br><small>${esc(l.notas)}</small>` : ""}`;
  if (tipo === "cot"){
    const terms = [`<p class="b">* Todos los precios son más IVA.</p>`, c.vigencia ? `<p>* Vigencia de cotización ${esc(c.vigencia)}.</p>` : "", c.tiempoEntrega ? `<p class="red">* Tiempo de entrega: ${esc(c.tiempoEntrega)}.</p>` : "",
      ...String(c.terminos || "").split("\n").map(t => t.trim()).filter(Boolean).map(t => `<p>* ${esc(t.replace(/^\*\s*/, ""))}</p>`)].join("");
    return `<div class="hoja">
      <div class="hd"><table><tr><td>COTIZACIÓN:</td><td>${esc(c.folio)}</td></tr><tr><td>FECHA:</td><td>${fDate(c.fecha)}</td></tr></table></div>
      <div class="cli"><b>Cliente:</b><span>${esc(e.cliente)}</span>${c.atencion ? `<b>Atención:</b><span>${esc(c.atencion)}</span>` : ""}<b>Asunto:</b><span>${esc(e.titulo)}</span></div>
      <div class="intro">${esc(String(c.intro || "").toUpperCase())}</div>
      <table class="it"><thead><tr><th style="width:9%">CANTIDAD</th><th style="width:9%">CLAVE</th><th>DESCRIPCIÓN</th><th style="width:19%">IMAGEN</th><th style="width:12%">PRECIO U.</th><th style="width:12%">IMPORTE</th></tr></thead><tbody>
      ${c.lineas.map(l => `<tr><td class="c">${esc(l.cantidad)}</td><td class="c">${esc(l.clave || "")}</td><td>${desc(l)}</td><td class="c im">${imgFor(l)}</td><td class="m"><span>$</span>${fmtNum(l.precioUnit)}</td><td class="m"><span>$</span>${fmtNum(l.importe)}</td></tr>`).join("")}
      ${c.flete ? `<tr><td class="c">1</td><td class="c">FLETE</td><td>Flete / envío</td><td class="c">N/A</td><td class="m"><span>$</span>${fmtNum(c.flete)}</td><td class="m"><span>$</span>${fmtNum(c.flete)}</td></tr>` : ""}
      </tbody></table>
      <div class="bottom"><div class="terms"><h4>TÉRMINOS COMERCIALES Y TIEMPO DE ENTREGA</h4>${terms}${c.nota ? `<p style="margin-top:6px;font-style:normal">${esc(c.nota)}</p>` : ""}</div>
      <table class="tot"><tr><td>SUBTOTAL</td><td class="s">$</td><td class="v">${fmtNum(c.subtotal)}</td></tr><tr><td>IVA</td><td class="s">$</td><td class="v">${fmtNum(c.ivaMonto)}</td></tr><tr class="g"><td>TOTAL</td><td class="s">$</td><td class="v">${fmtNum(c.total)}</td></tr></table></div>
    </div>`;
  }
  const o = e.orden; const tot = c.lineas.reduce((s, l) => s + l.costo * l.cantidad, 0);
  return `<div class="hoja">
    <div class="hd"><table><tr><td>ORDEN DE SERVICIO:</td><td>${esc(o.folio)}</td></tr><tr><td>FECHA:</td><td>${fDate(o.fecha)}</td></tr><tr><td>COMPROMISO:</td><td style="color:#d40000;font-weight:700">${o.fechaCompromiso ? fDate(new Date(o.fechaCompromiso + "T12:00:00").getTime()) : "—"}</td></tr></table></div>
    <div class="cli"><b>Proveedor:</b><span>${esc(prov?.nombre || "")}</span>${prov?.contacto ? `<b>Atención:</b><span>${esc(prov.contacto)}${prov.telefono ? " · " + esc(prov.telefono) : ""}</span>` : ""}<b>Trabajo:</b><span>${esc(e.titulo)}</span><b>Entregar en:</b><span>${esc(o.lugarEntrega || "Por confirmar")}</span></div>
    <div class="intro">POR MEDIO DE LA PRESENTE SE AUTORIZA LA REALIZACIÓN DEL SIGUIENTE SERVICIO:</div>
    <table class="it"><thead><tr><th style="width:9%">CANTIDAD</th><th style="width:9%">CLAVE</th><th>DESCRIPCIÓN</th><th style="width:19%">IMAGEN</th><th style="width:12%">COSTO U.</th><th style="width:12%">IMPORTE</th></tr></thead><tbody>
    ${c.lineas.map(l => `<tr><td class="c">${esc(l.cantidad)}</td><td class="c">${esc(l.clave || "")}</td><td>${desc(l)}</td><td class="c im">${imgFor(l)}</td><td class="m"><span>$</span>${fmtNum(l.costo)}</td><td class="m"><span>$</span>${fmtNum(l.costo * l.cantidad)}</td></tr>`).join("")}
    </tbody></table>
    <div class="bottom"><div></div><table class="tot"><tr class="g"><td>TOTAL (más IVA)</td><td class="s">$</td><td class="v">${fmtNum(tot)}</td></tr></table></div>
    ${o.instrucciones ? `<div class="box"><h4>INSTRUCCIONES DEL SERVICIO</h4>${esc(o.instrucciones)}</div>` : ""}
    <div class="terms"><p>* Enviar fotografías de evidencia del trabajo terminado y de la entrega.</p><p>* Cualquier cambio en material, medida o fecha debe confirmarse por escrito antes de producir.</p><p>* Referencia de cotización al cliente: ${esc(c.folio)} · Expediente ${esc(e.folio)}.</p></div>
    <div class="firmas"><div>Autoriza · ${esc(state.config.empresa)}</div><div>Recibe orden · ${esc(prov?.nombre || "Proveedor")}</div></div>
  </div>`;
}
function hojaStyles(){ return Array.from(document.styles || [document.querySelector("style")]).map(s => s.textContent).join("").split("/* ===== Hoja membretada")[1].replace(/^[^\n]*\n/, ""); }
function verHoja(e, tipo){
  if (!e || (tipo === "cot" && !e.cotizacion) || (tipo === "os" && !e.orden)) return;
  const folio = tipo === "cot" ? e.cotizacion.folio : e.orden.folio;
  const {close} = openModal({title:(tipo === "cot" ? "Cotización " : "Orden de servicio ") + folio, wide:true, noForm:true,
    body:`<div class="hoja-wrap"><div id="hoja-box"></div></div><p class="small muted" style="margin:0">Descarga la hoja y ábrela en tu navegador para imprimirla o guardarla como PDF (Imprimir → Guardar como PDF, tamaño Carta, márgenes ninguno).</p>`,
    extraFoot:`<button type="button" class="btn" id="h-copy">Copiar texto</button>${downloads ? `<button type="button" class="btn pri" id="h-dl">Descargar hoja</button>` : ""}`,
    onOpen: form => {
      const box = $("#hoja-box", form); box.innerHTML = hojaHTML(e, tipo);
      const fit = () => { const w = box.parentElement.clientWidth - 32; const k = Math.min(1, w / 816); const h = $(".hoja", box); h.style.transform = `scale(${k})`; h.style.transformOrigin = "top left"; box.style.height = (h.offsetHeight * k) + "px"; box.style.width = (816 * k) + "px"; };
      fit(); hydrateImages(box).then(fit);
      $("#h-copy", form).addEventListener("click", () => copyText(textoHoja(e, tipo), "Texto copiado."));
      const dl = $("#h-dl", form); if (dl) dl.addEventListener("click", async () => {
        dl.disabled = true; dl.textContent = "Preparando…";
        const html = await hojaStandalone(e, tipo);
        await saveFile(folio + " - " + (e.titulo || "").replace(/[\\/:*?"<>|]/g, "").slice(0, 60) + ".html", html, "text/html");
        dl.disabled = false; dl.textContent = "Descargar hoja";
      });
    }});
  void close;
}
async function hojaStandalone(e, tipo){
  const refs = (e.cotizacion?.lineas || []).map(l => l.imagen).filter(Boolean);
  const map = {};
  for (const r of refs){
    try {
      if (r.startsWith("asset:")){ const b = await (await fetch(srcOf(r))).blob(); map[r] = await blobToDataURL(b); }
      else if (r.startsWith("img:")){ const id = r.slice(4); if (!imgCache[id]){ const d = await Store.get("imagenes", id); if (d) imgCache[id] = d.data; } map[r] = imgCache[id] || ""; }
    } catch(_){}
  }
  const folio = tipo === "cot" ? e.cotizacion.folio : e.orden.folio;
  return `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>${esc(folio)}</title><style>@page{size:letter;margin:0}body{margin:0;background:#888}@media print{body{background:#fff}.hoja{margin:0!important;box-shadow:none!important}}.hoja{margin:20px auto;box-shadow:0 2px 12px rgba(0,0,0,.3);-webkit-print-color-adjust:exact;print-color-adjust:exact}${hojaStyles()}</style></head><body>${hojaHTML(e, tipo, map)}</body></html>`;
}
function textoHoja(e, tipo){
  const c = e.cotizacion;
  if (tipo === "cot"){
    return `COTIZACIÓN ${c.folio} · ${fDate(c.fecha)}\nCliente: ${e.cliente}${c.atencion ? " · At'n " + c.atencion : ""}\n${e.titulo}\n\n` +
      c.lineas.map(l => `${l.cantidad} × ${l.clave ? "[" + l.clave + "] " : ""}${l.descripcion} — P.U. ${money(l.precioUnit)} — Importe ${money(l.importe)}`).join("\n") +
      `${c.flete ? "\nFlete: " + money(c.flete) : ""}\n\nSubtotal: ${money(c.subtotal)}\nIVA: ${money(c.ivaMonto)}\nTOTAL: ${money(c.total)}\n\nVigencia: ${c.vigencia} · Tiempo de entrega: ${c.tiempoEntrega}\n${state.config.empresa}`;
  }
  const o = e.orden;
  return `ORDEN DE SERVICIO ${o.folio} · ${fDate(o.fecha)}\nProveedor: ${provName(e.proveedorId)}\nTrabajo: ${e.titulo}\nCompromiso: ${o.fechaCompromiso}\nEntregar en: ${o.lugarEntrega || "Por confirmar"}\n\n` +
    c.lineas.map(l => `${l.cantidad} × ${l.clave ? "[" + l.clave + "] " : ""}${l.descripcion} — Costo U. ${money(l.costo)}`).join("\n") + `\n\nInstrucciones:\n${o.instrucciones || "—"}`;
}

/* ================= Arranque ================= */
function startWatches(){
  Store.watch("expedientes", list => { state.exps = list; state.loaded.exps = true; scheduleRender(); });
  Store.watch("proveedores", list => { state.provs = list; state.loaded.provs = true; scheduleRender(); });
  Store.watch("config", list => { const g = list.find(d => d.id === "general"); state.config = {...DEFAULT_CONFIG, ...(g || {})}; delete state.config.id; state.loaded.config = true; scheduleRender(); });
  Store.watch("usuarios", list => { state.usuarios = list; state.loaded.usuarios = true; resolveSession(); });
  if (MODE === "db") Store.watch("vinculos", list => { state.vinculos = list; state.loaded.vinculos = true; resolveSession(); });
}
let ownerSeeded = false;
async function resolveSession(){
  const before = state.auth + "|" + JSON.stringify(state.session);
  let email = null;
  if (MODE === "local"){
    email = state.myEmail;
    if (!email){ state.auth = "demo"; state.session = null; }
  } else if (!state.me){ state.auth = "sinIdentidad"; state.session = null; }
  else if (!state.loaded.usuarios || !state.loaded.vinculos){ state.auth = "loading"; }
  else {
    const v = state.vinculos.find(x => x.id === state.me);
    if (!v){ state.auth = "identificar"; state.session = null; state.myEmail = null; }
    else {
      state.myEmail = String(v.email || "").toLowerCase();
      if (vinculoOwner(state.myEmail)?.id !== state.me){ state.auth = "conflicto"; state.session = null; }
      else email = state.myEmail;
    }
  }
  if (email && (MODE === "local" || state.loaded.usuarios)){
    let u = userByEmail(email);
    if (!u && state.isOwner && !ownerSeeded){
      ownerSeeded = true;
      const v = state.vinculos.find(x => x.id === state.me);
      try { await Store.put("usuarios", emailKey(email), {email, nombre:(v && v.nombre) || state.names[state.me] || email.split("@")[0], rol:"supervisor", activo:true, creado:now()}); return; }
      catch(e){ toast("No se pudo registrar al dueño como supervisor: " + (e.message || e.code), "bad"); }
    }
    if (!u){ state.auth = "pendiente"; state.session = null; }
    else if (u.activo === false){ state.auth = "inactivo"; state.session = null; }
    else { state.session = {id:u.id, email:String(u.email || "").toLowerCase(), nombre:u.nombre || u.email, rol:u.rol}; state.auth = "ok"; }
  }
  const after = state.auth + "|" + JSON.stringify(state.session);
  if (before !== after){ const m = $("#modal-root"); if (m && state.auth !== "ok") m.innerHTML = ""; render(); }
  else scheduleRender();
}
async function boot(){
  parseHash(); render();
  const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [d, u, a, dl] = await Promise.all([use("db"), use("user"), use("assets"), use("downloads")]);
  db = d; user = u; assets = a; downloads = dl;
  if (user){
    try { const me = await user.me(); state.me = me.id || null; state.isOwner = !!me.isOwner; if (me.name && state.me) state.names[state.me] = me.name; } catch(_){}
    try { const c = user.can ? await user.can("data.write") : null; if (c === false) state.canWrite = false; } catch(_){}
  }
  if (db){ MODE = "db"; $("#conn").innerHTML = '<span class="dot ok"></span>Base de datos compartida'; }
  else {
    MODE = "local"; local.load(); $("#conn").innerHTML = '<span class="dot local"></span>Modo local de prueba';
    try { state.myEmail = sessionStorage.getItem("dinamica-demo-email") || null; } catch(_){}
  }
  startWatches(); resolveSession();
}
boot();
