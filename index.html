<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotizador Dinámica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral de navegación en azul marino de marca + área de trabajo; el naranja de Dinámica marca la acción principal y los folios. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#f7f8fb; --ink:#141b33; --muted:#5d6580; --line:#dfe2ec;
  --navy:#1c2a5c; --navy-2:#24356f; --accent:#ec7414; --accent-2:#f2b51c; --accent-ink:#ffffff; --accent-soft:#fdeedf;
  --good:#1d8754; --good-soft:#e2f4ea; --warn:#a96a00; --warn-soft:#fbf0d6; --bad:#c23a2b; --bad-soft:#fbe5e2; --info:#2d5fc7; --info-soft:#e4ebfb;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif; --body:"IBM Plex Sans", "Segoe UI", Arial, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,27,51,.06), 0 4px 16px rgba(20,27,51,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1222; --surface:#161b2f; --surface-2:#1b2139; --ink:#e7eaf4; --muted:#9aa2bd; --line:#2b3352;
    --navy:#0a0e1c; --navy-2:#1a2246; --accent:#f58a33; --accent-2:#f5c24a; --accent-ink:#1a1206; --accent-soft:#3a2614;
    --good:#4cc38a; --good-soft:#15301f; --warn:#e3a93a; --warn-soft:#33270f; --bad:#f07a6c; --bad-soft:#3a1916; --info:#7ea4f5; --info-soft:#18244a;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1222; --surface:#161b2f; --surface-2:#1b2139; --ink:#e7eaf4; --muted:#9aa2bd; --line:#2b3352;
  --navy:#0a0e1c; --navy-2:#1a2246; --accent:#f58a33; --accent-2:#f5c24a; --accent-ink:#1a1206; --accent-soft:#3a2614;
  --good:#4cc38a; --good-soft:#15301f; --warn:#e3a93a; --warn-soft:#33270f; --bad:#f07a6c; --bad-soft:#3a1916; --info:#7ea4f5; --info-soft:#18244a;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--navy);color:#dfe4f5;padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{background:#fff;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.brand img{width:100%;height:auto;display:block}
.brand small{color:#5d6580;font-size:11px;text-align:right}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#c9d0ea;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:var(--accent);color:#fff}
.nav a .n{margin-left:auto;font:500 12px var(--mono);background:rgba(255,255,255,.14);padding:1px 7px;border-radius:20px}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:12px;color:#9aa4c8;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa4c8;margin-right:6px}
.dot.ok{background:#4cc38a}.dot.local{background:var(--accent-2)}
main{padding:24px clamp(16px,3vw,36px) 60px;min-width:0}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.topbar p{margin:4px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.navy{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;border-left:4px solid var(--line)}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font:800 28px/1.15 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.t-accent{border-left-color:var(--accent)}.kpi.t-warn{border-left-color:var(--warn)}.kpi.t-info{border-left-color:var(--info)}.kpi.t-good{border-left-color:var(--good)}.kpi.t-navy{border-left-color:var(--navy-2)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-neutral{background:var(--surface-2);color:var(--muted)}
.pill.t-info{background:var(--info-soft);color:var(--info)}.pill.t-warn{background:var(--warn-soft);color:var(--warn)}.pill.t-good{background:var(--good-soft);color:var(--good)}.pill.t-bad{background:var(--bad-soft);color:var(--bad)}.pill.t-accent{background:var(--accent-soft);color:var(--accent)}
.folio{font:500 13px var(--mono);color:var(--accent);letter-spacing:.02em}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-weight:600;color:var(--muted);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t tfoot td{font-weight:600;border-bottom:none}
.age{font:500 12px var(--mono);padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.age.w{background:var(--warn-soft);color:var(--warn)}.age.c{background:var(--bad-soft);color:var(--bad)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;min-width:0;width:100%}
textarea.input{resize:vertical;min-height:70px}
.search{max-width:320px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.pipe{display:flex;gap:4px;flex-wrap:wrap}
.pipe .seg{flex:1 1 110px;padding:10px 12px;background:var(--surface-2);border-radius:8px;border-top:3px solid var(--line);cursor:pointer}
.pipe .seg b{display:block;font:800 22px var(--display)}
.pipe .seg span{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:170px 1fr 80px;gap:10px;align-items:center;font-size:13px}
.bar{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px}
.stars{color:var(--accent-2);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
/* detalle */
.det-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:16px}
.det-head .meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:6px}
.det-head .meta b{color:var(--ink);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin-bottom:16px;padding:14px 10px}
.step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;font-size:12px;color:var(--muted);padding:0 4px}
.step::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step .c{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line);font:700 12px var(--display);z-index:1;position:relative}
.step.done .c{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.step.done::before{background:var(--navy-2)}
.step.cur .c{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.step.cur{color:var(--ink);font-weight:600}
.step time{font:500 10.5px var(--mono);color:var(--muted)}
.next{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.next h3{color:var(--ink)} .next p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.next .acts{display:flex;gap:8px;flex-wrap:wrap}
.gallery{display:flex;gap:10px;flex-wrap:wrap}
.thumb{width:110px;height:110px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);object-fit:cover;cursor:zoom-in;display:block}
.filetile{width:110px;height:110px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;text-align:center;font-size:12px;padding:8px;color:var(--ink);text-decoration:none;word-break:break-word}
.thumbbox{position:relative}
.thumbbox .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:22px;padding:0}
.ev{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:14px;position:relative}
.timeline li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .d{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--navy-2);margin-top:3px;z-index:1}
.timeline .d.a{border-color:var(--accent)}
.timeline b{font-weight:600}
.timeline .when{font:500 11.5px var(--mono);color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.formula{font:500 13px var(--mono);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;line-height:1.7}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 18px;max-width:320px;margin-left:auto;font-size:14px}
.totals .g{font:800 18px var(--display);border-top:2px solid var(--ink);padding-top:6px}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.prov-card{display:flex;flex-direction:column;gap:8px}
.provs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line)}
.modal.wide{width:min(980px,100%)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mb{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.err{color:var(--bad);font-size:13px}
.items-ed{display:flex;flex-direction:column;gap:8px}
.item-ed{display:grid;grid-template-columns:70px 90px 1fr 140px 32px;gap:8px;align-items:start;background:var(--surface-2);padding:8px;border-radius:8px}
.item-ed textarea{min-height:40px}
.costs-ed{display:grid;grid-template-columns:1fr 90px 130px 120px;gap:8px;align-items:center;font-size:14px}
.costs-ed .h{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio-row label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);padding:8px 12px;border-radius:8px;cursor:pointer}
.rate{display:flex;gap:4px}
.rate button{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--line);padding:0 2px}
.rate button.on{color:var(--accent-2)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:80;box-shadow:var(--shadow);max-width:380px;font-size:14px}
.toast.bad{background:var(--bad);color:#fff}
.lightbox img{max-width:100%;max-height:78vh;display:block;margin:auto;border-radius:6px}
.hoja-wrap{overflow:auto;background:#8a8fa3;padding:16px;border-radius:8px;max-height:72vh}
.hoja-scale{transform-origin:top left}
.mobile-top{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:10px}
  .brand{width:150px;padding:6px 8px}.brand small{display:none}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav a{padding:6px 10px;font-size:14px}.nav a .n{display:none}
  .side .foot{display:none}
  .two{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(7,minmax(70px,1fr));overflow-x:auto}
  .item-ed{grid-template-columns:1fr 1fr}
  .item-ed .full{grid-column:1/-1}
  .costs-ed{grid-template-columns:1fr 1fr}
  .bar-row{grid-template-columns:120px 1fr 64px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.hoja *{color:inherit}
.hoja .hd{display:flex;justify-content:flex-end;margin-bottom:14px}
.hoja .hd table{border-collapse:collapse}
.hoja .hd td{padding:1px 0 1px 12px;font-size:12px}

.hoja table.it td.m{white-space:nowrap;text-align:right}
.hoja table.it td.m span{float:left;padding-right:6px}

.hoja table.tot{border-collapse:collapse;width:100%}

.hoja table.tot td.v{text-align:right;border-left:0}

.hoja .terms h4{margin:0 0 2px;font-size:12px;font-weight:700}
.hoja .terms p{margin:0 0 1px}
.hoja .terms .red{color:#d40000;font-weight:700}
.hoja .terms .b{font-weight:700}
.hoja .box{border:1px solid #333;padding:8px 10px;margin-top:10px;white-space:pre-wrap}
.hoja .box h4{margin:0 0 4px;font-size:12px;font-style:normal}
.hoja .firmas{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:46px;text-align:center;font-size:11px}
.hoja .firmas div{border-top:1px solid #333;padding-top:4px}

}

/* Fórmula de precio al cliente */
function calcular(articulos, p){
  const margen = Number(p.margen) || 0, ind = Number(p.indirectos) || 0, iva = Number(p.iva) || 0, flete = r2(p.flete);
  const lineas = (articulos || []).map(a => {
    const costo = Number(a.costo) || 0, cant = Number(a.cantidad) || 0;
    const precioUnit = a.precioManual != null && a.precioManual !== "" ? r2(a.precioManual) : r2(costo * (1 + ind / 100) * (1 + margen / 100));
    return {...a, costo, cantidad:cant, precioUnit, importe:r2(precioUnit * cant), costoTotal:r2(costo * cant)};
  });
  const importeArt = r2(lineas.reduce((s, l) => s + l.importe, 0));
  const costoTotal = r2(lineas.reduce((s, l) => s + l.costoTotal, 0));
  const subtotal = r2(importeArt + flete);
  const ivaMonto = r2(subtotal * iva / 100);
  const total = r2(subtotal + ivaMonto);
  const utilidad = r2(importeArt - costoTotal);
  return {lineas, importeArt, costoTotal, flete, subtotal, ivaMonto, total, utilidad, margenReal: importeArt ? utilidad / importeArt * 100 : 0, margen, indirectos:ind, iva};
}

const LKEY = "dinamica-cotizador-local-v1";
const local = {
  data: {}, subs: {},
  load(){ try { this.data = JSON.parse(localStorage.getItem(LKEY) || "{}") || {}; } catch(e){ this.data = {}; } },
  save(){ try { localStorage.setItem(LKEY, JSON.stringify(this.data)); } catch(e){} },
  emit(coll){ (this.subs[coll] || []).forEach(cb => cb(this.list(coll))); },

const queues = {};
function enqueue(path, fn){
  const p = (queues[path] || Promise.resolve()).catch(() => {}).then(fn);
  queues[path] = p; return p;
}
const Store = {
  watch(coll, cb){
    if (db){
      return db.collection(coll).onSnapshot(s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))),
        e => toast("No se pudo leer " + coll + ": " + (e.message || e.code), "bad"));
    }
    (local.subs[coll] ||= []).push(cb); cb(local.list(coll)); return () => {};
  },
  async get(coll, id){
    if (db){ const s = await db.doc(coll + "/" + id).get(); return s.exists ? {id, ...s.data()} : null; }
    const d = (local.data[coll] || {})[id]; return d ? {id, ...d} : null;
  },
  put(coll, id, data){
    const clean = JSON.parse(JSON.stringify(data)); delete clean.id;
    const path = coll + "/" + id;
    return enqueue(path, async () => {
      if (db) return withRetry(() => db.doc(path).set(clean));
      (local.data[coll] ||= {})[id] = clean; local.save(); local.emit(coll);
    });
  },
  remove(coll, id){
    const path = coll + "/" + id;
    return enqueue(path, async () => {
      if (db) return withRetry(() => db.doc(path).delete());
      if (local.data[coll]) delete local.data[coll][id]; local.save(); local.emit(coll);
    });
  },
  async nextNumber(key, start){
    if (!db){
      const c = (local.data.config ||= {}); const d = (c.consecutivos ||= {});
      const n = Math.max(Number(d[key]) || 0, start) + 1; d[key] = n; local.save(); return n;
    }
    const ref = db.doc("config/consecutivos");
    const holder = state.me || newId();
    for (let i = 0; i < 10; i++){
      const r = await ref.acquire({holder, ttlMs:5000});
      if (r.acquired){
        const s = await ref.get();
        const d = s.exists ? {...s.data()} : {};
        const n = Math.max(Number(d[key]) || 0, start) + 1;
        d[key] = n;
        await withRetry(() => ref.set(d));
        return n;
      }
      await sleep(250 + Math.random() * 500);
    }
    throw new Error("El consecutivo está ocupado por otro usuario. Intenta de nuevo.");
  }
};
async function withRetry(fn){
  try { return await fn(); }
  catch(e){
    if (e && e.code === "unavailable"){ await sleep(400 + Math.random() * 600); return fn(); }
    if (e && e.code === "invalid_argument" && MODE === "db") { state.canWrite = false; }
    if (e && e.code === "quota_exceeded") throw new Error("La base de datos llegó a su límite: " + e.message);
    throw e;
  }
}

async function compressImage(file, maxSide, quality){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, maxSide / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b), "image/jpeg", quality));
  } finally { URL.revokeObjectURL(url); }
}
function blobToDataURL(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
async function uploadFile(file){
  const isImg = /^image\//.test(file.type);
  const isPdf = file.type === "application/pdf";
  if (!isImg && !isPdf) throw new Error(file.name + ": solo se aceptan imágenes o PDF.");
  if (assets){
    const blob = isImg && !/svg/.test(file.type) ? await compressImage(file, 1800, 0.82) : file;
    const r = await assets.upload(blob);
    return {ref:"asset:" + r.id, tipo: isImg ? "image" : "pdf", nombre: file.name};
  }
  if (isPdf) throw new Error("Para adjuntar PDF se necesita permiso de edición en esta página. Sube una imagen (foto o captura) del diseño.");
  const blob = await compressImage(file, 1000, 0.7);
  const data = await blobToDataURL(blob);
  const id = newId();
  await Store.put("imagenes", id, {data, nombre: file.name});
  imgCache[id] = data;
  return {ref:"img:" + id, tipo:"image", nombre:file.name};
}
const imgCache = {};
function srcOf(ref){
  if (!ref) return "";
  if (ref.startsWith("asset:")) return "/_blob/" + ref.slice(6);
  if (ref.startsWith("img:")) return imgCache[ref.slice(4)] || "";
  return "";
}
function thumbHTML(f, removable){
  if (!f) return "";
  if (f.tipo === "pdf"){
    return `<div class="thumbbox"><a class="filetile" href="${esc(srcOf(f.ref))}" target="_blank" rel="noopener">PDF<br>${esc(f.nombre || "diseño")}</a>${removable ? `<button type="button" class="x" data-rm="${esc(f.ref)}" aria-label="Quitar">×</button>` : ""}</div>`;
  }
  const s = srcOf(f.ref);
  return `<div class="thumbbox"><img class="thumb" alt="${esc(f.nombre || "imagen")}" data-ref="${esc(f.ref)}" ${s ? `src="${esc(s)}"` : ""} data-zoom="1">${removable ? `<button type="button" class="x" data-rm="${esc(f.ref)}" aria-label="Quitar">×</button>` : ""}</div>`;
}
async function hydrateImages(root = document){
  const pend = $$("img[data-ref]", root).filter(i => !i.getAttribute("src") && i.dataset.ref.startsWith("img:"));
  for (const i of pend){
    const id = i.dataset.ref.slice(4);
    if (!imgCache[id]){
      try { const d = await Store.get("imagenes", id); if (d) imgCache[id] = d.data; } catch(e){}
    }
    if (imgCache[id]) i.src = imgCache[id];
  }
}

  const card = inner => `<div style="min-height:70vh;display:grid;place-items:center"><div class="card pad" style="max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px">${inner}</div></div>`;
  switch (state.auth){
    case "loading": return card(`<h1>Cotizador Dinámica</h1><p class="muted" style="margin:0">Verificando tu identidad…</p>`);
    case "demo": return card(`<h1>Entrar</h1><p class="muted" style="margin:0">Escribe tu correo para identificarte.</p>
      <form id="demo-login" class="grid"><div class="field"><label for="dl-em">Correo electrónico</label><input class="input" id="dl-em" type="email" required placeholder="nombre@empresa.com"></div>
      <div class="field"><label for="dl-nom">Nombre</label><input class="input" id="dl-nom" placeholder="Solo si es la primera vez"></div>
      <div class="field"><label for="dl-rol">Perfil (solo la primera vez)</label><select class="input" id="dl-rol"><option value="vendedor">Vendedor</option><option value="comprador">Comprador</option><option value="supervisor">Supervisor</option></select></div>
      <div class="err" id="dl-err"></div><button class="btn pri" type="button" id="dl-go">Entrar</button></form>`);
    case "identificar": return card(`<h1>Identifícate</h1><p class="muted" style="margin:0">Es tu primera vez en el cotizador. Escribe el correo con el que el supervisor te dio de alta. Quedará ligado a tu cuenta y todo lo que hagas se registrará con él.</p>
      <form id="id-form" class="grid"><div class="field"><label for="id-em">Correo electrónico</label><input class="input" id="id-em" type="email" required placeholder="nombre@empresa.com"></div>
      <div class="field"><label for="id-nom">Nombre</label><input class="input" id="id-nom" value="${esc(state.names[state.me] || "")}"></div>
      <div class="err" id="id-err"></div><button class="btn pri" type="button" id="id-go">Continuar</button></form>`);
    case "conflicto": return card(`<h1>Correo ya vinculado</h1><p style="margin:0">El correo <b>${esc(state.myEmail || "")}</b> ya está ligado a otra cuenta. Si es tuyo, pide al supervisor que lo desvincule. Si te equivocaste al escribirlo, usa otro.</p><button class="btn" id="id-reset">Usar otro correo</button>`);
    case "sinIdentidad": return card(`<h1>Inicia sesión</h1><p style="margin:0">Para usar el cotizador necesitas entrar con tu cuenta. Abre la liga que te compartieron e inicia sesión con tu correo.</p>`);
    case "pendiente": return card(`<h1>Acceso pendiente</h1><p style="margin:0">Entraste como <b>${esc(state.myEmail || "usuario sin correo visible")}</b>, pero aún no tienes un perfil asignado.</p>${MODE === "db" ? `<button class="btn ghost sm" id="id-reset" style="align-self:flex-start">Corregir mi correo</button>` : ""}<p class="muted" style="margin:0">Ya enviamos tu solicitud. Pide al supervisor que te asigne el perfil de vendedor, comprador o supervisor en la sección Usuarios. Esta pantalla se actualiza sola.</p>`);
    case "inactivo": return card(`<h1>Acceso desactivado</h1><p style="margin:0">Tu usuario <b>${esc(state.myEmail || "")}</b> está desactivado. Habla con el supervisor si necesitas acceso.</p>`);
  }
  return "";
}
function bindGate(){
  const idf = $("#id-form");
  if (idf) wireSubmit(idf, $("#id-go"), async () => {
    const em = $("#id-em").value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ $("#id-err").textContent = "Escribe un correo válido."; return; }
    try { await Store.put("vinculos", state.me, {email:em, nombre:$("#id-nom").value.trim(), fecha:now()}); }
    catch(e){ $("#id-err").textContent = "No se pudo guardar: " + (e.message || e.code) + ". Verifica que te hayan compartido la página con permiso para editar."; }
  });
  const rs = $("#id-reset");
  if (rs) rs.addEventListener("click", async () => { try { await Store.remove("vinculos", state.me); } catch(e){ toast("No se pudo: " + (e.message || e.code), "bad"); } });
  const f = $("#demo-login"); if (!f) return;
  wireSubmit(f, $("#dl-go"), async () => {
    const em = $("#dl-em").value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ $("#dl-err").textContent = "Escribe un correo válido."; return; }
    if (!matchUsuario(em)){
      await Store.put("usuarios", emailKey(em), {email:em, nombre:$("#dl-nom").value.trim() || em.split("@")[0], rol:$("#dl-rol").value, activo:true, creado:now()});
    }
    try { sessionStorage.setItem("dinamica-demo-email", em); } catch(_){}
    state.myEmail = em; resolveSession();
  });
}
function pill(estado){ const s = ESTADOS[estado] || {label:estado, tone:"neutral"}; return `<span class="pill t-${s.tone}">${esc(s.label)}</span>`; }
function provName(id){ const p = state.provs.find(x => x.id === id); return p ? p.nombre : ""; }
function stageStart(e){
  const t = e.tiempos || {};
  switch (e.estado){
    case "solicitud": return t.solicitud;
    case "cotizando": return t.respuestaProveedor || t.enviadaProveedor;
    case "cotizada": return t.cotizada;
    case "aprobada": return t.autorizada;
    case "autorizada": return t.ordenEmitida || t.autorizada;
    case "en_proceso": return t.enProceso;
    case "terminada": return t.terminada;
    default: return null;
  }
}
function ageBadge(e){
  const s = stageStart(e); if (!s) return "";
  const ms = now() - s, d = ms / 86400000;
  return `<span class="age ${d > 5 ? "c" : d > 2 ? "w" : ""}">${dur(ms)}</span>`;
}
function lastAct(e){ const h = e.historial || []; return h.length ? h[h.length - 1].t : e.tiempos?.solicitud; }
function loadingView(){ return `<div class="card empty">Cargando información…</div>`; }

/* ---------- Tablero ---------- */
function viewTablero(){
  if (!state.loaded.exps) return loadingView();
  const VIS = visibleExps();
  const cola = isComp() ? VIS.filter(e => !e.compradorEmail && ACTIVOS.includes(e.estado)) : [];
  const E = isComp() ? VIS.filter(e => e.compradorEmail === myEmail()) : VIS;
  const by = k => E.filter(e => e.estado === k);
  const porCotizar = E.filter(e => ["solicitud","cotizando"].includes(e.estado));
  const espera = by("cotizada");
  const ejec = E.filter(e => ["autorizada","en_proceso"].includes(e.estado));
  const calif = by("terminada");
  const mesIni = new Date(); mesIni.setDate(1); mesIni.setHours(0,0,0,0);
  const autMes = E.filter(e => e.tiempos?.autorizada >= mesIni.getTime() && e.cotizacion);
  const montoAut = autMes.reduce((s, e) => s + (e.cotizacion.total || 0), 0);
  const montoEsp = espera.reduce((s, e) => s + (e.cotizacion?.total || 0), 0);
  const cotizadas = E.filter(e => e.tiempos?.cotizada);
  const decididas = cotizadas.filter(e => e.tiempos?.autorizada || e.tiempos?.rechazada);
  const conv = decididas.length ? Math.round(decididas.filter(e => e.tiempos.autorizada).length / decididas.length * 100) : null;

  const kpis = `<div class="kpis">
    ${isComp() ? `<div class="card kpi t-warn" style="cursor:pointer" data-filtro="porasignar"><div class="l">Por asignar</div><div class="v">${cola.length}</div><div class="s">solicitudes nuevas sin comprador</div></div>` : ""}
    <div class="card kpi t-info"><div class="l">${isVend() ? "En cotización" : "Por cotizar"}</div><div class="v">${porCotizar.length}</div><div class="s">solicitudes y en proveedor</div></div>
    <div class="card kpi t-warn"><div class="l">Esperando autorización</div><div class="v">${espera.length}</div><div class="s">${money(montoEsp)} en cotizaciones</div></div>
    <div class="card kpi t-accent"><div class="l">En ejecución</div><div class="v">${ejec.length}</div><div class="s">órdenes de servicio abiertas</div></div>
    ${isVend() ? `<div class="card kpi t-good"><div class="l">Entregados</div><div class="v">${E.filter(e => ["terminada","cerrada"].includes(e.estado)).length}</div><div class="s">trabajos terminados</div></div>` : `<div class="card kpi t-good"><div class="l">Por calificar</div><div class="v">${calif.length}</div><div class="s">trabajos terminados</div></div>`}
    <div class="card kpi t-navy"><div class="l">Autorizado este mes</div><div class="v">${money(montoAut).replace(/\.\d\d$/, "")}</div><div class="s">${autMes.length} órdenes · conversión ${conv == null ? "—" : conv + "%"}</div></div>
  </div>`;

  const pipe = `<div class="card pad" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2>${isSup() ? "Flujo de trabajo de todo el equipo" : isVend() ? "Mis solicitudes por etapa" : "Mis expedientes por etapa"}</h2>${isComp() ? "" : `<button class="btn pri" data-act="nueva">+ Nueva solicitud</button>`}</div><div class="pipe">${
    PASOS.map(p => { const n = by(p.k).length; const t = ESTADOS[p.k].tone; const col = {neutral:"var(--muted)",info:"var(--info)",warn:"var(--warn)",accent:"var(--accent)",good:"var(--good)"}[t];
      return `<div class="seg" style="border-top-color:${col}" data-filtro="${p.k}" role="button" tabindex="0"><b>${n}</b><span>${esc(ESTADOS[p.k].label)}</span></div>`; }).join("")
  }</div></div>`;

  const atencion = [...cola, ...E].filter(e => ACTIVOS.includes(e.estado)).sort((a, b) => (stageStart(a) || 0) - (stageStart(b) || 0)).slice(0, 8);
  const atHTML = `<div class="card"><div class="card-h"><h2>Requieren atención</h2><a class="btn ghost sm" href="#expedientes">Ver todos</a></div>
    ${atencion.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Folio</th><th>Trabajo</th><th>Estado</th><th>En etapa</th></tr></thead><tbody>${
      atencion.map(e => `<tr class="click" data-open="${e.id}"><td><span class="folio">${esc(e.cotizacion?.folio || e.folio)}</span></td><td><b>${esc(e.titulo)}</b><div class="small muted">${esc(e.cliente)}${e.prioridad === "urgente" ? ' · <span style="color:var(--bad);font-weight:600">Urgente</span>' : ""}${isSup() ? " · " + esc(userName(e.vendedorEmail) || e.vendedor || "") + (e.compradorEmail ? " → " + esc(userName(e.compradorEmail)) : " → <i>sin comprador</i>") : ""}</div></td><td>${!e.compradorEmail && isComp() ? '<span class="pill t-warn">Por asignar</span>' : pill(e.estado)}</td><td>${ageBadge(e)}</td></tr>`).join("")
    }</tbody></table></div>` : `<div class="empty">No hay expedientes activos. Crea una nueva solicitud para empezar.</div>`}</div>`;

  // tiempos promedio
  const avgs = ETAPAS.map(([a, b, l]) => {
    const v = E.map(e => e.tiempos && e.tiempos[a] && e.tiempos[b] ? e.tiempos[b] - e.tiempos[a] : null).filter(x => x != null && x >= 0);
    return {l, n:v.length, avg: v.length ? v.reduce((s, x) => s + x, 0) / v.length : null};
  });
  const maxAvg = Math.max(1, ...avgs.map(a => a.avg || 0));
  const ciclo = E.filter(e => e.tiempos?.cerrada && e.tiempos?.solicitud).map(e => e.tiempos.cerrada - e.tiempos.solicitud);
  const tiempos = `<div class="card"><div class="card-h"><h2>Tiempo promedio por etapa</h2><span class="small muted">Ciclo completo: <b>${ciclo.length ? dur(ciclo.reduce((s, x) => s + x, 0) / ciclo.length) : "—"}</b></span></div><div class="card-b bars">${
    avgs.map(a => `<div class="bar-row"><span>${esc(a.l)}</span><div class="bar"><i style="width:${a.avg ? Math.max(3, a.avg / maxAvg * 100) : 0}%"></i></div><span class="num small">${a.avg ? dur(a.avg) : "—"}</span></div>`).join("")
  }</div></div>`;

  const ranking = provStats().filter(p => p.trabajos > 0 || p.calif).sort((a, b) => (b.calif || 0) - (a.calif || 0)).slice(0, 6);
  const rk = `<div class="card"><div class="card-h"><h2>Proveedores mejor calificados</h2><a class="btn ghost sm" href="#proveedores">Ver todos</a></div>${
    ranking.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Proveedor</th><th>Calificación</th><th class="num">Trabajos</th><th class="num">A tiempo</th></tr></thead><tbody>${
      ranking.map(p => `<tr><td><b>${esc(p.nombre)}</b><div class="small muted">${esc(p.especialidad || "")}</div></td><td>${stars(p.calif)}</td><td class="num">${p.trabajos}</td><td class="num">${p.puntualidad == null ? "—" : p.puntualidad + "%"}</td></tr>`).join("")
    }</tbody></table></div>` : `<div class="empty">Aún no hay trabajos calificados.</div>`}</div>`;

  let carga = "";
  if (isSup()){
    const people = state.usuarios.filter(u => u.activo !== false && u.rol !== "supervisor");
    carga = `<div class="card" style="margin-top:16px"><div class="card-h"><h2>Carga de trabajo por persona</h2><a class="btn ghost sm" href="#usuarios">Usuarios</a></div>${people.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Persona</th><th>Perfil</th><th class="num">Activos</th><th class="num">Por autorizar</th><th class="num">Cerrados</th><th class="num">Autorizado</th><th>Última actividad</th></tr></thead><tbody>${
      people.map(u => { const k = u.rol === "vendedor" ? "vendedorEmail" : "compradorEmail"; const mine = state.exps.filter(e => (e[k] || "") === (u.email || "").toLowerCase());
        const last = Math.max(0, ...state.exps.flatMap(e => (e.historial || []).filter(h => h.porEmail === u.email).map(h => h.t)));
        return `<tr><td><b>${esc(u.nombre || u.email)}</b><div class="small muted">${esc(u.email)}</div></td><td>${rolPill(u.rol)}</td><td class="num">${mine.filter(e => ACTIVOS.includes(e.estado)).length}</td><td class="num">${mine.filter(e => e.estado === "cotizada").length}</td><td class="num">${mine.filter(e => e.estado === "cerrada").length}</td><td class="num">${money(mine.filter(e => e.orden && e.cotizacion).reduce((s, e) => s + e.cotizacion.total, 0))}</td><td class="small muted">${last ? fShort(last) : "—"}</td></tr>`; }).join("")
    }</tbody></table></div>` : `<div class="empty">Da de alta a vendedores y compradores en Usuarios.</div>`}</div>`;
  }
  const saludo = state.session?.nombre ? "Hola, " + state.session.nombre.split(" ")[0] : "Tablero";
  return `<div class="topbar"><div><h1>${esc(saludo)}</h1><p>${rolPill(rol())} · ${new Date().toLocaleDateString("es-MX", {weekday:"long", day:"numeric", month:"long", year:"numeric"})}</p></div></div>
    ${kpis}${pipe}<div class="two">${atHTML}<div class="grid">${tiempos}${isVend() ? "" : rk}</div></div>${carga}`;
}

function provStats(){
  return state.provs.map(p => {
    const mis = state.exps.filter(e => e.proveedorId === p.id);
    const trabajos = mis.filter(e => e.orden).length;
    const cal = mis.filter(e => e.calificacion?.promedio).map(e => e.calificacion.promedio);
    const term = mis.filter(e => e.tiempos?.terminada && e.orden?.fechaCompromiso);
    const atiempo = term.filter(e => e.tiempos.terminada <= new Date(e.orden.fechaCompromiso + "T23:59:59").getTime()).length;
    const resp = mis.filter(e => e.tiempos?.enviadaProveedor && e.tiempos?.respuestaProveedor).map(e => e.tiempos.respuestaProveedor - e.tiempos.enviadaProveedor);
    return {...p, trabajos, cotizados: mis.filter(e => e.tiempos?.respuestaProveedor).length,
      calif: cal.length ? cal.reduce((s, x) => s + x, 0) / cal.length : null, nCal: cal.length,
      puntualidad: term.length ? Math.round(atiempo / term.length * 100) : null,
      respuesta: resp.length ? resp.reduce((s, x) => s + x, 0) / resp.length : null,
      monto: mis.filter(e => e.orden && e.cotizacion).reduce((s, e) => s + (e.cotizacion.costoTotal || 0), 0)};
  });
}

/* ---------- Expedientes ---------- */
const FILTROS = [["activos","Activos"],["porasignar","Por asignar"],["solicitud","Solicitud"],["cotizando","Con proveedor"],["cotizada","Por autorizar"],["aprobada","Falta OS"],["autorizada","OS emitida"],["en_proceso","En proceso"],["terminada","Por calificar"],["cerrada","Cerradas"],["rechazada","Rechazadas"],["todos","Todos"]];
function viewExpedientes(){
  const filtros = FILTROS.filter(f => f[0] !== "porasignar" || !isVend());
  const sel = (id, label, r, val) => `<select class="input" id="${id}" style="width:auto" aria-label="${label}"><option value="">${label}: todos</option>${state.usuarios.filter(u => u.rol === r).map(u => `<option value="${esc(u.email)}" ${val === u.email ? "selected" : ""}>${esc(u.nombre || u.email)}</option>`).join("")}</select>`;
  return `<div class="topbar"><div><h1>${isVend() ? "Mis solicitudes" : "Expedientes"}</h1><p>${isVend() ? "Solo ves las solicitudes que tú registraste." : isComp() ? "Ves los expedientes que tienes asignados y las solicitudes nuevas por asignar." : "Todos los expedientes del equipo."}</p></div>${isComp() ? "" : `<button class="btn pri" data-act="nueva">+ Nueva solicitud</button>`}</div>
  <div class="toolbar"><input class="input search" id="q" type="search" placeholder="Buscar folio, cliente, trabajo…" value="${esc(state.q)}">
  ${isSup() ? sel("fvend", "Vendedor", "vendedor", state.fVend) + sel("fcomp", "Comprador", "comprador", state.fComp) : ""}
  <div class="chips">${filtros.map(([k, l]) => `<button class="chip ${state.filtro === k ? "on" : ""}" data-filtro="${k}">${l}</button>`).join("")}</div></div>
  <div class="card" id="list-body">${listBody()}</div>`;
}
function listBody(){
  if (!state.loaded.exps) return `<div class="empty">Cargando…</div>`;
  const q = state.q.trim().toLowerCase();
  let L = visibleExps().filter(e => state.filtro === "todos" ? true : state.filtro === "activos" ? ACTIVOS.includes(e.estado) : state.filtro === "porasignar" ? !e.compradorEmail && ACTIVOS.includes(e.estado) : e.estado === state.filtro);
  if (isSup() && state.fVend) L = L.filter(e => e.vendedorEmail === state.fVend);
  if (isSup() && state.fComp) L = L.filter(e => e.compradorEmail === state.fComp);
  if (q) L = L.filter(e => [e.folio, e.cotizacion?.folio, e.orden?.folio, e.titulo, e.cliente, e.vendedor, userName(e.compradorEmail), isVend() ? "" : provName(e.proveedorId), ...(e.articulos || []).map(a => a.descripcion)].join(" ").toLowerCase().includes(q));
  L.sort((a, b) => (lastAct(b) || 0) - (lastAct(a) || 0));
  if (!L.length) return `<div class="empty">${isVend() && !visibleExps().length ? "Aún no registras solicitudes. Usa “Nueva solicitud” para pedir una cotización." : "No hay expedientes con este filtro."}</div>`;
  return `<div class="tbl-wrap"><table class="t"><thead><tr><th>Folio</th><th>Trabajo / cliente</th>${isVend() ? "<th>Comprador</th>" : "<th>Vendedor</th><th>Comprador</th><th>Proveedor</th>"}<th>Estado</th><th class="num">Total</th><th>En etapa</th><th>Última actividad</th></tr></thead><tbody>${
    L.map(e => `<tr class="click" data-open="${e.id}">
      <td><div class="folio">${esc(e.folio)}</div>${e.cotizacion ? `<div class="folio" style="color:var(--navy-2)">${esc(e.cotizacion.folio)}</div>` : ""}</td>
      <td><b>${esc(e.titulo)}</b>${e.prioridad === "urgente" ? ' <span class="pill t-bad">Urgente</span>' : ""}<div class="small muted">${esc(e.cliente)}</div></td>
      ${isVend() ? "" : `<td>${esc(userName(e.vendedorEmail) || e.vendedor)}</td>`}<td>${e.compradorEmail ? esc(userName(e.compradorEmail)) : '<span class="pill t-warn">Por asignar</span>'}</td>${isVend() ? "" : `<td>${esc(provName(e.proveedorId)) || '<span class="muted">—</span>'}</td>`}
      <td>${pill(e.estado)}</td><td class="num">${e.cotizacion ? money(e.cotizacion.total) : '<span class="muted">—</span>'}</td>
      <td>${ageBadge(e)}</td><td class="small muted">${fShort(lastAct(e))}</td></tr>`).join("")
  }</tbody></table></div>`;
}

/* ---------- Detalle ---------- */
function viewDetalle(){
  if (!state.loaded.exps) return loadingView();
  const e = getExp(state.expId);
  if (!e || !visibleExps().includes(e)) return `<div class="card empty">No se encontró el expediente o no tienes acceso a él. <a href="#expedientes">Volver</a></div>`;
  const t = e.tiempos || {};
  const V = isVend(), W = canWork(e), own = e.vendedorEmail === myEmail();
  const curPaso = ESTADOS[e.estado]?.paso || 0;
  const steps = `<div class="card steps">${PASOS.map((p, i) => {
    const n = i + 1; const done = n < curPaso || e.estado === "cerrada"; const cur = n === curPaso && e.estado !== "cerrada" && e.estado !== "cancelada";
    const ts = t[p.t];
    return `<div class="step ${done ? "done" : ""} ${cur ? "cur" : ""}"><span class="c">${done ? "✓" : n}</span><span>${p.label}</span><time>${ts ? fShort(ts) : ""}</time></div>`;
  }).join("")}</div>`;

  const prov = state.provs.find(p => p.id === e.proveedorId);
  const calc = e.cotizacion || null;

  // artículos
  const arts = `<div class="card"><div class="card-h"><h2>Artículos solicitados</h2>${(W && ["solicitud","cotizando"].includes(e.estado)) || (V && own && e.estado === "solicitud") ? `<button class="btn sm" data-act="editar">Editar solicitud</button>` : ""}</div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th class="num">Cant.</th><th>Clave</th><th>Descripción</th>${V ? "" : '<th class="num">Costo prov.</th>'}<th class="num">Precio U.</th><th class="num">Importe</th></tr></thead><tbody>${
      (calc ? calc.lineas : e.articulos || []).map(a => `<tr><td class="num">${esc(a.cantidad)} ${esc(a.unidad || "")}</td><td class="folio" style="color:var(--ink)">${esc(a.clave || "")}</td><td>${esc(a.descripcion)}${a.notas ? `<div class="small muted">${esc(a.notas)}</div>` : ""}${a.imagen ? `<div style="margin-top:6px">${thumbHTML((e.imagenes || []).find(f => f.ref === a.imagen))}</div>` : ""}</td>
        ${V ? "" : `<td class="num">${a.costo != null && a.costo !== "" ? money(a.costo) : '<span class="muted">—</span>'}</td>`}<td class="num">${a.precioUnit != null ? money(a.precioUnit) : '<span class="muted">—</span>'}</td><td class="num">${a.importe != null ? money(a.importe) : '<span class="muted">—</span>'}</td></tr>`).join("")
    }</tbody></table></div>
    ${e.descripcion ? `<div class="card-b"><div class="tag">Indicaciones del vendedor</div><div style="white-space:pre-wrap">${esc(e.descripcion)}</div></div>` : ""}
    ${(e.imagenes || []).length ? `<div class="card-b" style="border-top:1px solid var(--line)"><div class="tag" style="margin-bottom:8px">Fotografías y diseños</div><div class="gallery">${e.imagenes.map(f => thumbHTML(f)).join("")}</div></div>` : ""}
  </div>`;

  // cotización
  let cot = "";
  if (calc){
    cot = `<div class="card"><div class="card-h"><h2>Cotización <span class="folio" style="font-size:15px">${esc(calc.folio)}</span></h2><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-act="ver-cot">Ver hoja</button>${W && ["cotizada","rechazada"].includes(e.estado) ? `<button class="btn sm" data-act="cotizar">Ajustar y reemitir</button>` : ""}</div></div>
      <div class="card-b grid">
        ${V ? "" : `<div class="formula">Precio U. = Costo proveedor × (1 + ${calc.indirectos}% indirectos) × (1 + ${calc.margen}% margen)<br>Subtotal = Σ importes${calc.flete ? " + flete " + money(calc.flete) : ""} · IVA ${calc.iva}%</div>`}
        <div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;align-items:flex-end">
          <dl class="kv"><dt>Emitida</dt><dd>${fDT(calc.fecha)}</dd><dt>Vigencia</dt><dd>${esc(calc.vigencia)}</dd><dt>Entrega</dt><dd>${esc(calc.tiempoEntrega)}</dd>${V ? "" : `<dt>Costo proveedor</dt><dd>${money(calc.costoTotal)}</dd><dt>Utilidad</dt><dd><b style="color:var(--good)">${money(calc.utilidad)}</b> <span class="small muted">(${calc.margenReal.toFixed(1)}% sobre venta)</span></dd>`}</dl>
          <div class="totals"><span>Subtotal</span><span class="num">${money(calc.subtotal)}</span><span>IVA ${calc.iva}%</span><span class="num">${money(calc.ivaMonto)}</span><span class="g">Total</span><span class="g num">${money(calc.total)}</span></div>
        </div>
        ${(e.cotizacionesAnteriores || []).length ? `<div class="small muted">Versiones anteriores: ${e.cotizacionesAnteriores.map(c => `<span class="folio">${esc(c.folio)}</span> (${money(c.total)})`).join(", ")}</div>` : ""}
      </div></div>`;
  }

  // orden
  let os = "";
  if (e.orden){
    os = `<div class="card"><div class="card-h"><h2>Orden de servicio <span class="folio" style="font-size:15px">${esc(e.orden.folio)}</span></h2>${V ? "" : `<button class="btn sm" data-act="ver-os">Ver hoja</button>`}</div>
      <div class="card-b grid"><dl class="kv">${V ? "" : `<dt>Proveedor</dt><dd><b>${esc(prov?.nombre || "—")}</b></dd>`}<dt>Emitida</dt><dd>${fDT(e.orden.fecha)}</dd><dt>Compromiso</dt><dd>${e.orden.fechaCompromiso ? fDate(new Date(e.orden.fechaCompromiso + "T12:00:00").getTime()) : "—"}</dd><dt>Entrega en</dt><dd>${esc(e.orden.lugarEntrega || "—")}</dd><dt>Autorizó</dt><dd>${esc(e.autorizacion?.por || "—")}${e.autorizacion?.referencia ? " · Ref. " + esc(e.autorizacion.referencia) : ""}</dd></dl>
      ${e.orden.instrucciones && !V ? `<div><div class="tag">Instrucciones al proveedor</div><div style="white-space:pre-wrap">${esc(e.orden.instrucciones)}</div></div>` : ""}</div></div>`;
  }

  // evidencias
  let evid = "";
  if (["autorizada","en_proceso","terminada","cerrada"].includes(e.estado) || (e.evidencias || []).length){
    evid = `<div class="card"><div class="card-h"><h2>Evidencia del trabajo</h2>${W && ["autorizada","en_proceso","terminada"].includes(e.estado) ? `<button class="btn sm" data-act="evidencia">+ Agregar evidencia</button>` : ""}</div><div class="card-b">${
      (e.evidencias || []).length ? e.evidencias.map(v => `<div class="ev"><div class="gallery">${(v.archivos || []).map(f => thumbHTML(f)).join("")}</div><div><div class="small muted">${fDT(v.fecha)} · ${esc(v.etapa || "")}</div><div style="white-space:pre-wrap">${esc(v.nota || "")}</div></div></div>`).join("")
      : `<div class="muted small">Aún no hay evidencia. Sube fotos del avance y del trabajo terminado.</div>`}</div></div>`;
  }

  // calificación
  let cal = "";
  if (e.calificacion && !V){
    const c = e.calificacion;
    cal = `<div class="card"><div class="card-h"><h2>Calificación del proveedor</h2>${stars(c.promedio)}</div><div class="card-b"><dl class="kv">
      <dt>Calidad</dt><dd>${stars(c.calidad)}</dd><dt>Puntualidad</dt><dd>${stars(c.puntualidad)}</dd><dt>Comunicación</dt><dd>${stars(c.comunicacion)}</dd><dt>Precio</dt><dd>${stars(c.precio)}</dd></dl>
      ${c.comentario ? `<p style="white-space:pre-wrap;margin:10px 0 0">${esc(c.comentario)}</p>` : ""}</div></div>`;
  }

  // tiempos
  const tiemposHTML = `<div class="card"><div class="card-h"><h2>Tiempos</h2></div><div class="card-b"><dl class="kv">${
    ETAPAS.map(([a, b, l]) => `<dt>${l}</dt><dd class="num" style="text-align:left">${t[a] && t[b] ? dur(t[b] - t[a]) : t[a] && !t[b] && stageStart(e) === t[a] ? `<span class="age w">${dur(now() - t[a])} en curso</span>` : "—"}</dd>`).join("")
  }<dt><b>Total</b></dt><dd><b>${t.solicitud ? dur((t.cerrada || t.cancelada || now()) - t.solicitud) : "—"}</b></dd></dl></div></div>`;

  const hist = `<div class="card"><div class="card-h"><h2>Historial</h2><span class="small muted">${(e.historial || []).length} movimientos</span></div><div class="card-b"><ol class="timeline">${
    (e.historial || []).slice().reverse().map((h, i) => `<li><span class="d ${i === 0 ? "a" : ""}"></span><div><b>${esc(h.accion)}</b>${detalleVisible(h) ? `<div class="small" style="white-space:pre-wrap">${esc(detalleVisible(h))}</div>` : ""}<div class="when">${fDT(h.t)} · ${esc(whoOf(h))}${h.rol ? " · " + esc(ROLES[h.rol] || h.rol) : ""}</div></div></li>`).join("")
  }</ol></div></div>`;

  const head = `<div class="det-head"><div><a href="#expedientes" class="btn ghost sm">← Expedientes</a>
    <h1 style="margin-top:8px">${esc(e.titulo)}</h1>
    <div class="meta"><span class="folio" style="font-size:14px">${esc(e.folio)}</span>${pill(e.estado)}${e.prioridad === "urgente" ? '<span class="pill t-bad">Urgente</span>' : ""}
    <span>Cliente: <b>${esc(e.cliente)}</b>${e.contacto ? " · " + esc(e.contacto) : ""}</span><span>Vendedor: <b>${esc(userName(e.vendedorEmail) || e.vendedor)}</b></span><span>Comprador: <b>${e.compradorEmail ? esc(userName(e.compradorEmail)) : "Por asignar"}</b></span>${e.fechaRequerida ? `<span>Requerido: <b>${fDate(new Date(e.fechaRequerida + "T12:00:00").getTime())}</b></span>` : ""}${prov && !V ? `<span>Proveedor: <b>${esc(prov.nombre)}</b></span>` : ""}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${isSup() && ACTIVOS.includes(e.estado) ? `<button class="btn sm" data-act="asignar">${e.compradorEmail ? "Reasignar comprador" : "Asignar comprador"}</button>` : ""}${ACTIVOS.includes(e.estado) && e.estado !== "terminada" && (W || (V && own && e.estado === "solicitud")) ? `<button class="btn ghost danger sm" data-act="cancelar">Cancelar expediente</button>` : ""}</div></div>`;

  return head + steps + nextStep(e) + `<div class="two"><div class="grid">${arts}${cot}${os}${evid}${cal}</div><div class="grid">${tiemposHTML}${hist}</div></div>`;
}

function nextStep(e){
  const prov = state.provs.find(p => p.id === e.proveedorId);
  const box = (h, p, acts) => `<div class="next"><div><h3>${h}</h3><p>${p}</p></div><div class="acts">${acts || ""}</div></div>`;
  const comp = e.compradorEmail ? esc(userName(e.compradorEmail)) : "";
  const W = canWork(e);
  if (isVend()){
    switch (e.estado){
      case "solicitud": return box(comp ? `${comp} recibió tu solicitud` : "Solicitud enviada a compras", comp ? "El comprador está preparando la cotización con el proveedor." : "Un comprador tomará tu solicitud en breve.");
      case "cotizando": return box(`${comp || "Compras"} está cotizando`, "Te avisaremos aquí cuando la cotización esté lista para el cliente.");
      case "cotizada": return box(`Cotización ${esc(e.cotizacion?.folio)} lista para el cliente`, `Total ${money(e.cotizacion?.total)}. Envíala al cliente y registra su respuesta.`, `<button class="btn" data-act="ver-cot">Ver / descargar</button><button class="btn danger" data-act="rechazar">Cliente rechazó</button><button class="btn pri" data-act="autorizar">Cliente autorizó</button>`);
      case "aprobada": return box("Autorización registrada", `${comp || "Compras"} emitirá la orden de servicio al proveedor.`);
      case "autorizada": case "en_proceso": return box("Trabajo en producción", `Entrega comprometida: ${e.orden?.fechaCompromiso ? fDate(new Date(e.orden.fechaCompromiso + "T12:00:00").getTime()) : "por confirmar"}.`);
      case "terminada": case "cerrada": return `<div class="next" style="border-color:var(--good);background:var(--good-soft)"><div><h3>Trabajo terminado</h3><p>Revisa la evidencia de entrega abajo.</p></div></div>`;
      case "rechazada": return box("Cotización rechazada", esc(e.autorizacion?.notas || ""), `<button class="btn" data-act="ver-cot">Ver cotización</button>`);
      case "cancelada": return box("Expediente cancelado", esc(e.cancelacion || ""));
    }
    return "";
  }
  if (!e.compradorEmail && ACTIVOS.includes(e.estado)){
    return box("Solicitud sin comprador asignado", `Registrada por ${esc(userName(e.vendedorEmail) || e.vendedor)} ${fDT(e.tiempos?.solicitud)}.`, `${isComp() ? `<button class="btn pri" data-act="tomar">Tomar esta solicitud</button>` : ""}${isSup() ? `<button class="btn pri" data-act="asignar">Asignar comprador</button>` : ""}`);
  }
  if (!W && !["cerrada","cancelada"].includes(e.estado)) return box(`Asignado a ${comp}`, "Solo el comprador asignado o el supervisor pueden registrar movimientos.");
  switch (e.estado){
    case "solicitud": return box("Siguiente paso: solicitar cotización al proveedor", "Elige el proveedor que puede dar el servicio y envíale las especificaciones y las imágenes.", `<button class="btn pri" data-act="enviar-prov">Solicitar al proveedor</button>`);
    case "cotizando":
      if (!e.tiempos?.respuestaProveedor) return box(`Esperando costos de ${esc(prov?.nombre || "proveedor")}`, `Solicitado ${fDT(e.tiempos?.enviadaProveedor)}. Captura los costos cuando el proveedor responda.`, `<button class="btn" data-act="enviar-prov">Cambiar proveedor / reenviar</button><button class="btn pri" data-act="costos">Registrar costos del proveedor</button>`);
      return box("Siguiente paso: generar cotización al cliente", "Los costos del proveedor ya están capturados. Aplica la fórmula y asigna el consecutivo.", `<button class="btn" data-act="costos">Editar costos</button><button class="btn pri" data-act="cotizar">Generar cotización</button>`);
    case "cotizada": return box(`Cotización ${esc(e.cotizacion?.folio)} enviada al cliente`, `Total ${money(e.cotizacion?.total)}. El vendedor o tú pueden registrar la respuesta del cliente.`, `<button class="btn" data-act="ver-cot">Ver / descargar</button><button class="btn danger" data-act="rechazar">Cliente rechazó</button><button class="btn pri" data-act="autorizar">Cliente autorizó · Generar OS</button>`);
    case "aprobada": return box("El cliente autorizó: emite la orden de servicio", `Autorizó ${esc(e.autorizacion?.por || "")} ${fDT(e.autorizacion?.fecha)}${e.autorizacion?.anticipo ? " · anticipo " + money(e.autorizacion.anticipo) : ""}.`, `<button class="btn pri" data-act="emitir-os">Generar orden de servicio</button>`);
    case "autorizada": return box(`Orden ${esc(e.orden?.folio)} emitida a ${esc(prov?.nombre || "proveedor")}`, "Envía la orden al proveedor y registra cuando inicie el trabajo.", `<button class="btn" data-act="ver-os">Ver / descargar OS</button><button class="btn pri" data-act="iniciar">Proveedor inició el trabajo</button>`);
    case "en_proceso": return box("Trabajo en proceso", `Compromiso de entrega: ${e.orden?.fechaCompromiso ? fDate(new Date(e.orden.fechaCompromiso + "T12:00:00").getTime()) : "sin fecha"}. Sube evidencia del avance y marca la entrega.`, `<button class="btn" data-act="evidencia">+ Evidencia</button><button class="btn pri" data-act="terminar">Marcar trabajo terminado</button>`);
    case "terminada": return box("Siguiente paso: calificar al proveedor", "Evalúa calidad, puntualidad, comunicación y precio para cerrar el expediente.", `<button class="btn pri" data-act="calificar">Calificar y cerrar</button>`);
    case "rechazada": return box("Cotización rechazada", esc(e.autorizacion?.notas || "El cliente no autorizó la cotización."), `<button class="btn pri" data-act="reabrir">Reabrir para recotizar</button>`);
    case "cancelada": return box("Expediente cancelado", esc(e.cancelacion || ""), W ? `<button class="btn" data-act="reabrir">Reabrir</button>` : "");
    case "cerrada": return `<div class="next" style="border-color:var(--good);background:var(--good-soft)"><div><h3>Expediente cerrado</h3><p>Ciclo completo en ${dur((e.tiempos?.cerrada || 0) - (e.tiempos?.solicitud || 0))}.</p></div></div>`;
  }
  return "";
}

/* ---------- Proveedores ---------- */
function viewProveedores(){
  const S = provStats().filter(p => !state.provQ || (p.nombre + " " + (p.especialidad || "")).toLowerCase().includes(state.provQ.toLowerCase()))
    .sort((a, b) => (a.activo === false) - (b.activo === false) || a.nombre.localeCompare(b.nombre));
  return `<div class="topbar"><div><h1>Proveedores</h1><p>Directorio, desempeño y calificaciones de quienes dan el servicio.</p></div><button class="btn pri" data-act="nuevo-prov">+ Nuevo proveedor</button></div>
  <div class="toolbar"><input class="input search" id="provq" type="search" placeholder="Buscar proveedor o especialidad…" value="${esc(state.provQ)}"></div>
  ${!state.loaded.provs ? loadingView() : S.length ? `<div class="provs">${S.map(p => `<div class="card pad prov-card" style="${p.activo === false ? "opacity:.6" : ""}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><h2>${esc(p.nombre)}</h2><div class="small muted">${esc(p.especialidad || "Sin especialidad")}</div></div><button class="btn ghost sm" data-editprov="${p.id}">Editar</button></div>
    <div>${stars(p.calif)} ${p.nCal ? `<span class="small muted">(${p.nCal})</span>` : ""}</div>
    <dl class="kv small"><dt>Contacto</dt><dd>${esc(p.contacto || "—")}</dd><dt>Teléfono</dt><dd>${esc(p.telefono || "—")}</dd><dt>Correo</dt><dd>${esc(p.email || "—")}</dd>
    <dt>Órdenes</dt><dd>${p.trabajos} · cotizó ${p.cotizados}</dd><dt>A tiempo</dt><dd>${p.puntualidad == null ? "—" : p.puntualidad + "%"}</dd><dt>Respuesta prom.</dt><dd>${p.respuesta ? dur(p.respuesta) : "—"}</dd><dt>Comprado</dt><dd>${money(p.monto)}</dd></dl>
    ${p.activo === false ? '<span class="pill t-neutral">Inactivo</span>' : ""}</div>`).join("")}</div>` : `<div class="card empty">Aún no hay proveedores. Agrega el primero.</div>`}`;
}

/* ---------- Bitácora ---------- */
function bitacoraRows(){
  const rows = [];
  visibleExps().forEach(e => {
    const H = (e.historial || []).slice().sort((a, b) => a.t - b.t);
    H.forEach((h, i) => rows.push({t:h.t, folio:e.folio, cot:e.cotizacion?.folio || "", expId:e.id, titulo:e.titulo, cliente:e.cliente, accion:h.accion, detalle:detalleVisible(h), por:whoOf(h), email:h.porEmail || "", rol: ROLES[h.rol] || "", desde: i ? h.t - H[i - 1].t : null}));
  });
  return rows.filter(r => !isSup() || !state.bUser || r.email === state.bUser).sort((a, b) => b.t - a.t);
}
function viewBitacora(){
  return `<div class="topbar"><div><h1>Bitácora</h1><p>${isSup() ? "Todos los movimientos del equipo" : "Movimientos de tus expedientes"} con fecha, hora, usuario y tiempo desde el movimiento anterior.</p></div>
  <div style="display:flex;gap:8px"><button class="btn" data-act="copiar-csv">Copiar CSV</button><button class="btn navy" data-act="descargar-csv" ${downloads ? "" : "hidden"}>Descargar CSV</button></div></div>
  <div class="toolbar"><input class="input search" id="bq" type="search" placeholder="Filtrar por folio, acción, cliente…" value="${esc(state.bq)}">${isSup() ? `<select class="input" id="buser" style="width:auto" aria-label="Usuario"><option value="">Todos los usuarios</option>${state.usuarios.map(u => `<option value="${esc(u.email)}" ${state.bUser === u.email ? "selected" : ""}>${esc(u.nombre || u.email)} · ${esc(ROLES[u.rol] || "")}</option>`).join("")}</select>` : ""}</div>
  <div class="card" id="bit-body">${bitBody()}</div>`;
}
function bitBody(){
  if (!state.loaded.exps) return `<div class="empty">Cargando…</div>`;
  const q = state.bq.trim().toLowerCase();
  const R = bitacoraRows().filter(r => !q || [r.folio, r.cot, r.titulo, r.cliente, r.accion, r.detalle, r.por].join(" ").toLowerCase().includes(q));
  if (!R.length) return `<div class="empty">Sin movimientos.</div>`;
  return `<div class="tbl-wrap"><table class="t"><thead><tr><th>Fecha y hora</th><th>Folio</th><th>Trabajo</th><th>Movimiento</th><th>Usuario</th><th>Desde anterior</th></tr></thead><tbody>${
    R.slice(0, 500).map(r => `<tr class="click" data-open="${r.expId}"><td class="small" style="white-space:nowrap;font-family:var(--mono)">${fDT(r.t)}</td><td><span class="folio">${esc(r.folio)}</span>${r.cot ? `<div class="folio" style="color:var(--navy-2)">${esc(r.cot)}</div>` : ""}</td><td>${esc(r.titulo)}<div class="small muted">${esc(r.cliente)}</div></td><td><b>${esc(r.accion)}</b>${r.detalle ? `<div class="small muted" style="white-space:pre-wrap">${esc(r.detalle)}</div>` : ""}</td><td class="small">${esc(r.por)}${r.email ? `<div class="muted">${esc(r.email)}</div>` : ""}</td><td><span class="age">${r.desde == null ? "inicio" : dur(r.desde)}</span></td></tr>`).join("")
  }</tbody></table></div>${R.length > 500 ? `<div class="empty small">Mostrando 500 de ${R.length}. Usa el filtro o descarga el CSV.</div>` : ""}`;
}
function csvBitacora(){
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const head = ["Fecha","Hora","Folio solicitud","Folio cotización","Trabajo","Cliente","Movimiento","Detalle","Usuario","Correo","Perfil","Minutos desde anterior"];
  const lines = bitacoraRows().map(r => { const d = new Date(r.t); return [d.toLocaleDateString("es-MX"), d.toLocaleTimeString("es-MX"), r.folio, r.cot, r.titulo, r.cliente, r.accion, r.detalle, r.por, r.email, r.rol, r.desde == null ? "" : Math.round(r.desde / 60000)].map(q).join(","); });
  return "﻿" + head.map(q).join(",") + "\n" + lines.join("\n");
}

/* ---------- Usuarios ---------- */
const canManageUsers = () => MODE === "local" || state.isOwner;
function viewUsuarios(){
  const pend = pendientesAcceso();
  const U = state.usuarios.slice().sort((a, b) => (a.activo === false) - (b.activo === false) || String(a.rol).localeCompare(String(b.rol)) || String(a.nombre).localeCompare(String(b.nombre)));
  const stats = em => {
    const H = state.exps.flatMap(e => (e.historial || []).filter(h => h.porEmail === em));
    return {mov:H.length, last:H.length ? Math.max(...H.map(h => h.t)) : 0,
      exps: state.exps.filter(e => e.vendedorEmail === em || e.compradorEmail === em).length};
  };
  return `<div class="topbar"><div><h1>Usuarios</h1><p>Quién entra al cotizador, con qué perfil y qué ha hecho.</p></div>${canManageUsers() ? `<button class="btn pri" data-act="nuevo-usuario">+ Dar de alta usuario</button>` : ""}</div>
  <div class="card pad" style="margin-bottom:16px"><h3>Cómo dar acceso a una persona</h3>
    <ol style="margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px">
      <li>Dala de alta aquí con su <b>correo</b> y su perfil: vendedor, comprador o supervisor.</li>
      <li>Comparte esta página con ese mismo correo desde el botón <b>Compartir</b>, con permiso para editar.</li>
      <li>La primera vez que entre con su cuenta escribirá su correo. Queda ligado a su cuenta y todo lo que haga se registra a su nombre. Si alguien entra sin estar dado de alta, aparece abajo como solicitud de acceso.</li>
    </ol>

    "calificar": () => calificarForm(e), "reabrir": () => reabrir(e), "cancelar": () => cancelarForm(e), "nuevo-prov": () => provForm(),
    "tomar": () => tomar(e), "asignar": () => asignarForm(e), "emitir-os": () => emitirOSForm(e), "nuevo-usuario": () => usuarioForm(),

  };

  const LIBRE = ["nueva","ver-cot","copiar-csv","descargar-csv"];

  if (isComp() && a === "nueva") return toast("Las solicitudes las registra el vendedor.", "bad");

async function copyText(txt, ok){
  try { await navigator.clipboard.writeText(txt); toast(ok || "Copiado."); }
  catch(e){ openModal({title:"Copiar", noForm:true, body:`<p class="small muted">Tu navegador no permitió copiar automáticamente. Selecciona el texto y cópialo.</p><textarea class="input" rows="12" readonly>${esc(txt)}</textarea>`}); }
}
async function saveFile(filename, data, type){
  if (!downloads){ toast("La descarga no está disponible aquí. Usa Copiar.", "bad"); return; }
  try { await downloads.save({filename, data}); }
  catch(e){
    try { await downloads.save({filename, data: new Blob([data], {type: type || "text/plain"})}); }
    catch(e2){ if (!/cancel|declin|denied/i.test(String(e2?.code || e2?.message))) toast("No se pudo descargar: " + (e2?.message || e2), "bad"); }
  }
}

/* ================= Envío sin depender de <form submit> (las vistas previas aisladas lo bloquean) ================= */
function wireSubmit(form, btn, handler){
  if (!form || !btn) return;
  let busy = false;
  const go = async ev => { if (ev) ev.preventDefault(); if (busy) return; busy = true; try { await handler(); } finally { busy = false; } };
  btn.addEventListener("click", go);
  form.addEventListener("submit", go);
  form.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.tagName === "INPUT" && !["checkbox","radio","file","button"].includes(ev.target.type)) go(ev); });
}
/* ================= Modal ================= */
function openModal({title, body, submit, onSubmit, wide, noForm, extraFoot, onOpen}){
  const root = $("#modal-root");
  root.innerHTML = `<div class="ov" id="ov"><div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="mt">
    <form id="mform" novalidate><div class="mh"><h2 id="mt">${esc(title)}</h2><button type="button" class="btn ghost sm" data-close aria-label="Cerrar">✕</button></div>
    <div class="mb">${body}<div class="err" id="merr"></div></div>
    <div class="mf">${extraFoot || ""}<button type="button" class="btn" data-close>${noForm ? "Cerrar" : "Cancelar"}</button>${noForm ? "" : `<button type="button" class="btn pri" id="msubmit">${esc(submit || "Guardar")}</button>`}</div></form></div></div>`;
  const close = () => { root.innerHTML = ""; if (renderPending){ renderPending = false; render(); } };
  $$("[data-close]", root).forEach(b => b.addEventListener("click", close));
  $("#ov").addEventListener("mousedown", ev => { if (ev.target.id === "ov") close(); });
  document.addEventListener("keydown", function k(ev){ if (ev.key === "Escape"){ close(); document.removeEventListener("keydown", k); } });
  if (noForm) $("#mform").addEventListener("submit", ev => ev.preventDefault());
  else wireSubmit($("#mform"), $("#msubmit"), async () => {
    const btn = $("#msubmit"); btn.disabled = true; $("#merr").textContent = "";
    try { const r = await onSubmit(new FormData($("#mform")), $("#mform")); if (r !== false) close(); }
    catch(err){ $("#merr").textContent = err.message || String(err); }
    finally { if (btn.isConnected) btn.disabled = false; }
  });
  hydrateImages(root);
  onOpen && onOpen($("#mform"));
  const f = $("input:not([type=hidden]),textarea,select", root); if (f && !noForm) f.focus();
  return {close};
}

function cotizarForm(e){
  const c = state.config; const prev = e.cotizacion;
  const p0 = prev ? {margen:prev.margen, indirectos:prev.indirectos, iva:prev.iva, flete:prev.flete} : {margen:c.margen, indirectos:c.indirectos, iva:c.iva, flete:c.flete};
  const manual = Object.fromEntries((prev?.lineas || []).filter(l => l.precioManual != null && l.precioManual !== "").map(l => [l.id, l.precioManual]));
  const body = `<div class="row">
      <div class="field"><label for="q-m">Margen %</label><input class="input" id="q-m" name="margen" type="number" step="0.1" value="${esc(p0.margen)}"></div>
      <div class="field"><label for="q-i">Indirectos %</label><input class="input" id="q-i" name="indirectos" type="number" step="0.1" value="${esc(p0.indirectos)}"></div>
      <div class="field"><label for="q-iva">IVA %</label><input class="input" id="q-iva" name="iva" type="number" step="0.1" value="${esc(p0.iva)}"></div>
      <div class="field"><label for="q-f">Flete $</label><input class="input" id="q-f" name="flete" type="number" step="0.01" value="${esc(p0.flete)}"></div></div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th class="num">Cant.</th><th>Descripción</th><th class="num">Costo</th><th class="num">Precio U. fórmula</th><th class="num">Precio U. final</th><th class="num">Importe</th></tr></thead><tbody id="q-body"></tbody></table></div>
    <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end"><div class="small" id="q-util"></div><div class="totals" id="q-tot"></div></div>
    <div class="row"><div class="field"><label for="q-v">Vigencia</label><input class="input" id="q-v" name="vigencia" value="${esc(prev?.vigencia || c.vigencia)}"></div>
    <div class="field"><label for="q-te">Tiempo de entrega</label><input class="input" id="q-te" name="tiempoEntrega" value="${esc(prev?.tiempoEntrega || c.tiempoEntrega)}"></div>
    <div class="field"><label for="q-at">Atención a</label><input class="input" id="q-at" name="atencion" value="${esc(prev?.atencion || e.contacto || "")}"></div></div>
    <div class="field"><label for="q-n">Nota adicional en la cotización</label><textarea class="input" id="q-n" name="nota">${esc(prev?.nota || "")}</textarea></div>
    ${prev ? `<div class="banner info" style="margin:0">Se emitirá un nuevo folio. ${esc(prev.folio)} quedará registrada como versión anterior.</div>` : ""}`;
  let last = null;
  const compute = form => {
    const p = {margen:form.elements.margen.value, indirectos:form.elements.indirectos.value, iva:form.elements.iva.value, flete:form.elements.flete.value};
    const arts = e.articulos.map(a => ({...a, precioManual: form.elements["pm-" + a.id] ? (form.elements["pm-" + a.id].value === "" ? null : Number(form.elements["pm-" + a.id].value)) : (manual[a.id] ?? null)}));
    return calcular(arts, p);
  };
  openModal({title: prev ? "Reemitir cotización" : "Generar cotización al cliente", wide:true, submit: prev ? "Reemitir con nuevo folio" : "Generar cotización", body,
    onOpen: form => {
      const formula = calcular(e.articulos.map(a => ({...a, precioManual:null})), {});
      $("#q-body", form).innerHTML = e.articulos.map(a => `<tr><td class="num">${esc(a.cantidad)}</td><td>${esc(a.descripcion)}</td><td class="num">${money(a.costo)}</td><td class="num" data-pf="${esc(a.id)}"></td><td class="num"><input class="input" style="width:110px;text-align:right" type="number" step="0.01" min="0" name="pm-${esc(a.id)}" placeholder="auto" value="${manual[a.id] ?? ""}" aria-label="Precio final manual"></td><td class="num" data-pi="${esc(a.id)}"></td></tr>`).join("");
      const upd = () => {
        last = compute(form);
        const auto = calcular(e.articulos.map(a => ({...a, precioManual:null})), {margen:form.elements.margen.value, indirectos:form.elements.indirectos.value, iva:0});
        auto.lineas.forEach(l => { $(`[data-pf="${l.id}"]`, form).textContent = money(l.precioUnit); });
        last.lineas.forEach(l => { $(`[data-pi="${l.id}"]`, form).textContent = money(l.importe); });
        $("#q-tot", form).innerHTML = `<span>Subtotal</span><span class="num">${money(last.subtotal)}</span><span>IVA ${last.iva}%</span><span class="num">${money(last.ivaMonto)}</span><span class="g">Total</span><span class="g num">${money(last.total)}</span>`;
        $("#q-util", form).innerHTML = `Costo proveedor <b>${money(last.costoTotal)}</b> · Utilidad <b style="color:${last.utilidad >= 0 ? "var(--good)" : "var(--bad)"}">${money(last.utilidad)}</b> (${last.margenReal.toFixed(1)}% sobre venta)`;
        void formula;
      };
      form.addEventListener("input", upd); upd();
    },
    onSubmit: async (fd, form) => {
      if (e.articulos.some(a => a.costo == null)) throw new Error("Faltan costos del proveedor.");
      const calc = compute(form);
      if (calc.total <= 0) throw new Error("El total de la cotización es cero. Revisa costos y margen.");
      const n = await Store.nextNumber("cot", Number(state.config.inicioConsecutivo) || 0);
      const folio = (state.config.prefijo || "COT") + n;
      const x = clone(getExp(e.id));
      if (x.cotizacion){ (x.cotizacionesAnteriores ||= []).push({folio:x.cotizacion.folio, total:x.cotizacion.total, fecha:x.cotizacion.fecha}); }
      x.cotizacion = {...calc, folio, fecha:now(), vigencia:String(fd.get("vigencia") || ""), tiempoEntrega:String(fd.get("tiempoEntrega") || ""), atencion:String(fd.get("atencion") || ""), nota:String(fd.get("nota") || ""),
        intro:state.config.intro, terminos:state.config.terminos, empresa:state.config.empresa, direccion:state.config.direccion};
      x.estado = "cotizada"; x.tiempos.cotizada = now(); delete x.tiempos.rechazada;
      log(x, prev ? "Cotización reemitida " + folio : "Cotización generada " + folio, `Total ${money(calc.total)} · margen ${calc.margen}% · utilidad ${money(calc.utilidad)}`);
      await saveExp(x); toast("Cotización " + folio + " generada.");
      setTimeout(() => verHoja(getExp(e.id) || x, "cot"), 50);
    }});
}

function evidenciaForm(e, alTerminar){

      });
    },
    onSubmit: async fd => {

      if (files.length || nota) (x.evidencias ||= []).push({id:newId(), fecha:now(), archivos:files, nota, etapa: alTerminar ? "Entrega" : (ESTADOS[x.estado]?.label || ""), por:state.me});
      if (alTerminar){
        if (!(x.evidencias || []).length) throw new Error("Para marcar terminado sube al menos una foto de evidencia.");

        const comp = x.orden?.fechaCompromiso ? new Date(x.orden.fechaCompromiso + "T23:59:59").getTime() : null;
        const rec = String(fd.get("recibio") || "");
        log(x, "Trabajo terminado y entregado", `${rec ? "Recibió " + rec + " · " : ""}${comp ? (x.tiempos.terminada <= comp ? "A tiempo" : "Con retraso de " + dur(x.tiempos.terminada - comp)) : ""}`);
      } else {
        if (x.estado === "autorizada"){ x.estado = "en_proceso"; x.tiempos.enProceso = now(); log(x, "Proveedor inició el trabajo", "Registrado al subir la primera evidencia"); }
        log(x, "Evidencia agregada", `${files.length} archivo${files.length === 1 ? "" : "s"}${nota ? " · " + nota : ""}`);
      }
      await saveExp(x); toast(alTerminar ? "Trabajo marcado como terminado." : "Evidencia guardada.");
    }});
}
function terminarForm(e){ evidenciaForm(e, true); }
function calificarForm(e){
  const crit = [["calidad","Calidad del trabajo"],["puntualidad","Puntualidad"],["comunicacion","Comunicación"],["precio","Precio"]];
  const comp = e.orden?.fechaCompromiso ? new Date(e.orden.fechaCompromiso + "T23:59:59").getTime() : null;
  const sug = comp && e.tiempos?.terminada ? (e.tiempos.terminada <= comp ? 5 : e.tiempos.terminada - comp < 86400000 * 2 ? 3 : 2) : 0;
  const vals = {calidad:0, puntualidad:sug, comunicacion:0, precio:0};
  const body = `<p class="small muted" style="margin:0">Proveedor: <b>${esc(provName(e.proveedorId))}</b>${sug ? ` · La puntualidad se sugiere según la fecha compromiso.` : ""}</p>
    ${crit.map(([k, l]) => `<div class="field"><label>${l}</label><div class="rate" data-k="${k}">${[1,2,3,4,5].map(n => `<button type="button" data-n="${n}" aria-label="${n} estrellas">★</button>`).join("")}</div></div>`).join("")}
    <div class="field"><label for="k-c">Comentario</label><textarea class="input" id="k-c" name="comentario" placeholder="¿Volverías a trabajar con este proveedor? ¿Qué mejorar?"></textarea></div>`;
  openModal({title:"Calificar proveedor y cerrar", submit:"Calificar y cerrar expediente", body,
    onOpen: form => {
      const draw = () => $$(".rate", form).forEach(r => $$("button", r).forEach(b => b.classList.toggle("on", Number(b.dataset.n) <= vals[r.dataset.k])));
      $$(".rate button", form).forEach(b => b.addEventListener("click", () => { vals[b.parentElement.dataset.k] = Number(b.dataset.n); draw(); }));
      draw();
    },
    onSubmit: async fd => {
      if (Object.values(vals).some(v => !v)) throw new Error("Califica los cuatro criterios.");
      const x = clone(getExp(e.id));
      const promedio = r2((vals.calidad + vals.puntualidad + vals.comunicacion + vals.precio) / 4);
      x.calificacion = {...vals, promedio, comentario:String(fd.get("comentario") || ""), fecha:now(), por:state.me};
      x.estado = "cerrada"; x.tiempos.cerrada = now();
      log(x, "Proveedor calificado y expediente cerrado", `${provName(x.proveedorId)}: ${promedio.toFixed(1)} de 5`);
      await saveExp(x); toast("Expediente cerrado.");
    }});
}
async function reabrir(e){
  try {
    const x = clone(getExp(e.id));
    const prevEstado = x.estado;
    x.estado = x.proveedorId ? "cotizando" : "solicitud";
    if (x.tiempos.cancelada) delete x.tiempos.cancelada;
    log(x, "Expediente reabierto", "Estado anterior: " + (ESTADOS[prevEstado]?.label || prevEstado));
    await saveExp(x); toast("Expediente reabierto.");
  } catch(err){ toast(err.message, "bad"); }
}
function cancelarForm(e){
  openModal({title:"Cancelar expediente " + e.folio, submit:"Cancelar expediente", body:`<div class="field"><label for="x-m">Motivo de la cancelación</label><textarea class="input" id="x-m" name="motivo" required></textarea></div>`,
    onSubmit: async fd => {
      const m = String(fd.get("motivo") || "").trim(); if (!m) throw new Error("Escribe el motivo.");
      const x = clone(getExp(e.id)); x.estado = "cancelada"; x.cancelacion = m; x.tiempos.cancelada = now(); log(x, "Expediente cancelado", m); await saveExp(x); toast("Expediente cancelado.");
    }});
}
